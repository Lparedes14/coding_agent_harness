[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "guild-coding-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openai==3.37.0",
    "python-dotenv==1.2.4",
]

[project.scripts]
coding-agent = "coding_agent.agent:main"

[tool.setuptools.packages.find]
where = ["src"]
