[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "guild-coding-agent"
version = "0.1.0"
description = "A minimal coding-agent harness for AI Guild workshops"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai==3.37.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
coding-agent = "coding_agent.agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
